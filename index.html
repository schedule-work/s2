<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KUMC Kinetic Schedule</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 키네틱 웹 디자인용 폰트: Syncopate(와이드 타이틀), Space Grotesk(본문/메뉴) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 키네틱/사이버틱한 네온 포인트 컬러 */
            --neon-accent: #ccff00; /* 애시드 그린 */
            --bg-dark: #09090b;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .font-kinetic {
            font-family: 'Syncopate', sans-serif;
        }

        /* 1. 끊임없이 교차하는 키네틱 마키 (Marquee) 헤더 */
        .kinetic-ticker {
            background-color: var(--neon-accent);
            color: var(--bg-dark);
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            align-items: center;
            height: 32px;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }
        
        .ticker-track {
            display: inline-block;
            animation: ticker 15s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 2. 크리에이티브 버튼 인터랙션 */
        .nav-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        /* 호버 시 네온 컬러가 차오르는 효과 */
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--neon-accent);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }
        
        .nav-btn:hover::before,
        .nav-btn[data-active="true"]::before {
            top: 0;
        }

        .nav-btn:hover,
        .nav-btn[data-active="true"] {
            color: var(--bg-dark);
            font-weight: 700;
            border-color: var(--neon-accent);
        }

        /* 3. 소분류 탭 (초소형 디자인으로 공간 확보) */
        .sub-scroll-container {
            display: flex;
            overflow-x: auto;
            align-items: center;
            scrollbar-width: none; /* Firefox */
        }
        .sub-scroll-container::-webkit-scrollbar {
            display: none; /* Chrome */
        }

        .sub-tab {
            white-space: nowrap;
            transition: color 0.2s;
            opacity: 0.6;
        }
        .sub-tab:hover {
            opacity: 1;
        }
        .sub-tab[data-active="true"] {
            opacity: 1;
            color: var(--neon-accent);
            position: relative;
        }
        .sub-tab[data-active="true"]::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--neon-accent);
        }

        /* 4. 글리치/키네틱 로딩 효과 */
        .glitch-text {
            animation: glitch 1s linear infinite;
        }
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
    </style>
</head>
<body>

    <!-- 1. 키네틱 티커 (가장 위에서 끊임없이 흐르는 전광판) -->
    <div class="kinetic-ticker shrink-0">
        <div class="ticker-track">
            <span class="mx-4">KOREA UNIVERSITY GURO HOSPITAL</span>
            <span class="mx-2">•</span>
            <span class="mx-4 font-kinetic">CLINICAL SUPPORT NURSING</span>
            <span class="mx-2">•</span>
            <span class="mx-4">INTEGRATED DUTY SCHEDULE</span>
            <span class="mx-2">•</span>
            <span class="mx-4 font-kinetic">REAL-TIME SYNC</span>
            <span class="mx-2">•</span>
            <!-- 반복 -->
            <span class="mx-4">KOREA UNIVERSITY GURO HOSPITAL</span>
            <span class="mx-2">•</span>
            <span class="mx-4 font-kinetic">CLINICAL SUPPORT NURSING</span>
            <span class="mx-2">•</span>
            <span class="mx-4">INTEGRATED DUTY SCHEDULE</span>
            <span class="mx-2">•</span>
            <span class="mx-4 font-kinetic">REAL-TIME SYNC</span>
            <span class="mx-2">•</span>
        </div>
    </div>

    <!-- 2. 컨트롤 패널 (최소한의 높이로 압축) -->
    <header class="flex flex-col sm:flex-row items-center justify-between px-4 py-2 border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-md shrink-0 z-20">
        
        <!-- 대분류 버튼 (크리에이티브 호버 효과) -->
        <div class="flex gap-2 w-full sm:w-auto mb-2 sm:mb-0">
            <button id="btn-group1" class="nav-btn px-4 py-1.5 border border-zinc-700 text-xs font-bold uppercase tracking-wider text-zinc-300 w-1/2 sm:w-auto text-center" onclick="toggleGroup('group1', this)">
                진료지원
            </button>
            <button id="btn-group2" class="nav-btn px-4 py-1.5 border border-zinc-700 text-xs font-bold uppercase tracking-wider text-zinc-300 w-1/2 sm:w-auto text-center" onclick="toggleGroup('group2', this)">
                전담간호사
            </button>
        </div>

        <!-- 소분류 메뉴 (공간 절약형 가로 스크롤) -->
        <div class="flex-1 overflow-hidden sm:ml-6 flex items-center h-8">
            <div id="group1-sub" class="sub-scroll-container gap-6 hidden w-full px-2"></div>
            <div id="group2-sub" class="sub-scroll-container gap-6 hidden w-full px-2"></div>
        </div>
        
    </header>

    <!-- 3. 메인 콘텐츠 (화면 100% 꽉 채우기) -->
    <main class="flex-1 w-full relative z-0 bg-zinc-900">
        <!-- 키네틱 로딩 화면 -->
        <div id="loading-overlay" class="absolute inset-0 bg-zinc-950/90 flex flex-col items-center justify-center z-20 hidden">
            <div class="font-kinetic text-3xl md:text-5xl text-[var(--neon-accent)] glitch-text tracking-tighter mb-2">
                FETCHING DATA
            </div>
            <div class="text-xs text-zinc-400 tracking-[0.3em] uppercase animate-pulse">
                Please stand by...
            </div>
        </div>
        
        <!-- 시트 프레임 (상하좌우 여백 없이 100%) -->
        <iframe id="sheet-frame" class="absolute inset-0 w-full h-full border-0" src=""></iframe>
    </main>

    <script>
        // API 설정 유지
        const sheetGroups = {
            group1: {
                name: "진료지원",
                pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyaIg5AxN1I8wD2Jrjr1o952ObrO_sHA3vL_Z1403dZLx9u9ooqmlLyuv5fQmeN6HnMmFdIRgCfi7_/pubhtml",
                api: "https://script.google.com/macros/s/AKfycbz_FRqb7fbZwxNg_eWIXjDL15tW8iZGllcs7y6-qzZev7YtFHgRNJUSgm9n7352AZXJYw/exec"
            },
            group2: {
                name: "전담간호사",
                pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWjnyzr3Qa-UuQ9fRf3lwiRm4vVA7jLOPtJiYe9TU1C-n4dyHcqVk967ahJJWpG_SUbsXwfdBC8Rh-/pubhtml",
                api: "https://script.google.com/macros/s/AKfycbzBpLXtYgjmbzRp74KMrdb2_tZTJYkAQn_aMRQ2AQau3IoofRKA42tzEKpOGn4Hhftmew/exec"
            }
        };

        function toggleGroup(groupKey, buttonEl) {
            document.getElementById('group1-sub').classList.add('hidden');
            document.getElementById('group2-sub').classList.add('hidden');
            
            const container = document.getElementById(`${groupKey}-sub`);
            container.classList.remove('hidden');

            document.querySelectorAll(".nav-btn").forEach(btn => btn.dataset.active = "false");
            buttonEl.dataset.active = "true";

            if (container.childElementCount > 0) return;

            const loadingOverlay = document.getElementById("loading-overlay");
            loadingOverlay.classList.remove("hidden");

            const { api, pubhtmlPrefix } = sheetGroups[groupKey];

            fetch(api)
                .then(res => res.json())
                .then(sheets => {
                    container.innerHTML = '';
                    sheets.forEach(({ name, gid }, index) => {
                        const btn = document.createElement("button");
                        btn.textContent = name;
                        
                        // 사이버틱/키네틱 감성의 소분류 텍스트 버튼
                        btn.className = "sub-tab text-[13px] font-semibold tracking-wide py-1 uppercase";
                        btn.dataset.active = "false";
                        
                        btn.onclick = () => {
                            document.getElementById("sheet-frame").src = `${pubhtmlPrefix}?gid=${gid}&widget=true&headers=false`;
                            
                            document.querySelectorAll(".sub-tab").forEach(b => b.dataset.active = "false");
                            btn.dataset.active = "true";
                        };
                        container.appendChild(btn);

                        if (groupKey === 'group1' && index === 0) {
                            btn.click();
                        }
                    });
                })
                .catch(err => {
                    container.innerHTML = "<p class='text-[#ccff00] text-xs font-bold'>ERROR LOADING DATA</p>";
                    console.error(err);
                })
                .finally(() => {
                    loadingOverlay.classList.add("hidden");
                });
        }

        // 초기화 로직
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const groupKey = urlParams.get('group');
            const sheetName = urlParams.get('sheet');

            if (!(groupKey && sheetName)) {
                document.getElementById("btn-group1")?.click(); 
                
                fetch(sheetGroups.group1.api)
                    .then(res => res.json())
                    .then(sheets => {
                        const first = sheets[0];
                        if (first) {
                            document.getElementById("sheet-frame").src =
                                `${sheetGroups.group1.pubhtmlPrefix}?gid=${first.gid}&widget=true&headers=false`;
                        }
                    });
            } else {
                const targetGroupBtn = document.getElementById(`btn-${groupKey}`);
                if(targetGroupBtn) targetGroupBtn.click();

                if (sheetGroups[groupKey]) {
                    fetch(sheetGroups[groupKey].api)
                        .then(res => res.json())
                        .then(sheets => {
                            const match = sheets.find(s => s.name === sheetName);
                            if (match) {
                                document.getElementById("sheet-frame").src =
                                    `${sheetGroups[groupKey].pubhtmlPrefix}?gid=${match.gid}&widget=true&headers=false`;
                                
                                setTimeout(() => {
                                    const subContainer = document.getElementById(`${groupKey}-sub`);
                                    const buttons = subContainer.getElementsByTagName('button');
                                    for(let btn of buttons) {
                                        if(btn.textContent === sheetName) {
                                            document.querySelectorAll(".sub-tab").forEach(b => b.dataset.active = "false");
                                            btn.dataset.active = "true";
                                            break;
                                        }
                                    }
                                }, 1000);
                            }
                        });
                }
            }
        });
    </script>
</body>
</html>
