<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>[임상지원간호팀] 근무표</title>
  <link rel="icon" type="image/x-icon" href="https://schedule-work.github.io/image/nurse.ico">
  <style>
    /* --------------------------------------
       전체 테마 설정 (심플 & 모던)
    -------------------------------------- */
    :root {
      --primary-color: #3b82f6;       /* 메인 포인트 컬러 (블루) */
      --primary-hover: #2563eb;       /* 버튼 호버 컬러 */
      --bg-color: #f3f4f6;            /* 전체 배경색 */
      --nav-bg: #ffffff;              /* 상단 메뉴 배경색 */
      --text-main: #1f2937;           /* 기본 글자색 */
      --text-muted: #6b7280;          /* 보조 글자색 */
      --border-color: #e5e7eb;        /* 테두리 선 색상 */
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      display: flex;
      flex-direction: column;         /* 위아래 수직 배치 */
      height: 100vh;                  /* 화면 전체 높이 사용 */
      overflow: hidden;               /* 페이지 전체 스크롤 방지 */
    }

    /* --------------------------------------
       상단 헤더 영역 (제목 & 알림 & 토글)
    -------------------------------------- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--nav-bg);
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .notice {
      color: var(--text-muted);
      font-size: 13px;
      background: #f9fafb;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .toggle-button {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .toggle-button:hover {
      background-color: #f3f4f6;
      color: var(--text-main);
    }

    /* --------------------------------------
       상단 메뉴 영역 (진료지원 / 전담간호사 탭)
    -------------------------------------- */
    .top-nav {
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    /* 토글로 메뉴가 접혔을 때 */
    .top-nav.collapsed {
      padding-top: 0;
      padding-bottom: 0;
      max-height: 0;
      border-bottom: none;
      opacity: 0;
    }

    .section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* 메인 그룹 라벨 (진료지원, 전담간호사) */
    .group-btn {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      min-width: 90px;
      text-align: center;
      cursor: default; /* 클릭 기능은 내부적으로 동작하나 시각적으로는 라벨처럼 표현 */
    }

    /* 개별 시트 버튼 (서브 버튼)들 */
    .sub-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sub-buttons button {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      border-radius: 20px; /* 둥근 알약 모양 */
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sub-buttons button:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    /* 선택된 활성 탭 스타일 */
    .sub-buttons button.active {
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
    }

    /* --------------------------------------
       스프레드시트 본문 영역
    -------------------------------------- */
    .content {
      flex-grow: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .iframe-wrapper {
      flex-grow: 1;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  
  <!-- 상단 헤더 -->
  <header class="header">
    <div class="header-left">
      <h1>[임상지원간호팀] 통합 근무표</h1>
      <span class="notice">※ 시트 로딩에 다소 시간이 걸릴 수 있습니다. 잠시만 기다려 주세요.</span>
    </div>
    <button class="toggle-button" onclick="toggleNav()" title="메뉴 숨기기/보이기">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      메뉴 토글
    </button>
  </header>

  <!-- 상단 네비게이션 메뉴 (기존 사이드바 역할) -->
  <nav class="top-nav" id="top-nav">
    <div class="section">
      <button id="btn-group1" class="group-btn" onclick="toggleGroup('group1', this)">진료지원</button>
      <div id="group1-sub" class="sub-buttons"></div>
    </div>
    <div class="section">
      <button id="btn-group2" class="group-btn" onclick="toggleGroup('group2', this)">전담간호사</button>
      <div id="group2-sub" class="sub-buttons"></div>
    </div>
  </nav>

  <!-- 시트 출력 본문 -->
  <main class="content">
    <div class="iframe-wrapper">
      <iframe id="sheet-frame" src=""></iframe>
    </div>
  </main>

  <script>
    // --- 설정 변수는 기존과 100% 동일하게 유지 ---
    const sheetGroups = {
      group1: {
        name: "진료지원",
        pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyaIg5AxN1I8wD2Jrjr1o952ObrO_sHA3vL_Z1403dZLx9u9ooqmlLyuv5fQmeN6HnMmFdIRgCfi7_/pubhtml",
        api: "https://script.google.com/macros/s/AKfycbz_FRqb7fbZwxNg_eWIXjDL15tW8iZGllcs7y6-qzZev7YtFHgRNJUSgm9n7352AZXJYw/exec"
      },
      group2: {
        name: "전담간호사",
        pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWjnyzr3Qa-UuQ9fRf3lwiRm4vVA7jLOPtJiYe9TU1C-n4dyHcqVk967ahJJWpG_SUbsXwfdBC8Rh-/pubhtml",
        api: "https://script.google.com/macros/s/AKfycbzBpLXtYgjmbzRp74KMrdb2_tZTJYkAQn_aMRQ2AQau3IoofRKA42tzEKpOGn4Hhftmew/exec"
      }
    };

    let firstLoaded = {};

    function toggleGroup(groupKey, buttonEl) {
      const container = document.getElementById(`${groupKey}-sub`);

      // 클래스명 탐색 대상만 .sidebar에서 .top-nav로 변경
      document.querySelectorAll(".top-nav .section > button").forEach(btn => btn.classList.remove("active"));
      buttonEl.classList.add("active");

      if (container.childElementCount > 0) return;

      const { api, pubhtmlPrefix } = sheetGroups[groupKey];

      fetch(api)
        .then(res => res.json())
        .then(sheets => {
          container.innerHTML = '';
          sheets.forEach(({ name, gid }, index) => {
            const btn = document.createElement("button");
            btn.textContent = name;
            btn.onclick = () => {
              document.getElementById("sheet-frame").src = `${pubhtmlPrefix}?gid=${gid}&widget=true&headers=false`;
              document.querySelectorAll(".sub-buttons button").forEach(b => b.classList.remove("active"));
              btn.classList.add("active");
            };
            container.appendChild(btn);

            if (groupKey === 'group1' && index === 0) {
              btn.click();
            }
          });
        })
        .catch(err => {
          container.innerHTML = "<p style='color:#ef4444; font-size:13px;'>시트 로딩 실패</p>";
          console.error(err);
        });
    }

    // 사이드바 대신 상단 메뉴를 접고 펴는 함수로 역할 유지
    function toggleNav() {
      const nav = document.getElementById("top-nav");
      // 메뉴 높이를 고정하여 애니메이션이 자연스럽게 적용되게 처리
      if (!nav.style.maxHeight || nav.style.maxHeight !== '0px') {
        nav.style.maxHeight = '0px';
        nav.classList.add("collapsed");
      } else {
        nav.style.maxHeight = '500px'; 
        nav.classList.remove("collapsed");
      }
    }

    // --- URL 파라미터 확인 및 로딩 로직 (기존 코드 완벽 동일) ---
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const groupKey = urlParams.get('group');
      const sheetName = urlParams.get('sheet');

      // ▶ URL 파라미터 없을 때만 진료지원 첫 시트 자동 로드
      if (!(groupKey && sheetName)) {
        fetch(sheetGroups.group1.api)
          .then(res => res.json())
          .then(sheets => {
            const first = sheets[0];
            if (first) {
              document.getElementById("sheet-frame").src =
                `${sheetGroups.group1.pubhtmlPrefix}?gid=${first.gid}&widget=true&headers=false`;
            }
          });
      }

      // 탭 렌더링은 항상 수행
      document.getElementById("btn-group1")?.click();
      document.getElementById("btn-group2")?.click();

      // ▶ URL 파라미터로 들어왔을 경우 해당 시트 열기
      if (groupKey && sheetGroups[groupKey]) {
        fetch(sheetGroups[groupKey].api)
          .then(res => res.json())
          .then(sheets => {
            const match = sheets.find(s => s.name === sheetName);
            if (match) {
              document.getElementById("sheet-frame").src =
                `${sheetGroups[groupKey].pubhtmlPrefix}?gid=${match.gid}&widget=true&headers=false`;
                
              // URL로 들어온 버튼 시각적 활성화 동기화 (기능 외적 보조 스크립트)
              setTimeout(() => {
                const subContainer = document.getElementById(`${groupKey}-sub`);
                const buttons = subContainer.getElementsByTagName('button');
                for(let btn of buttons) {
                  if(btn.textContent === sheetName) {
                    document.querySelectorAll(".sub-buttons button").forEach(b => b.classList.remove("active"));
                    btn.classList.add('active');
                    break;
                  }
                }
              }, 800);
            }
          });
      }
      
      // 초기 메뉴 높이 설정 (접기/펼치기 애니메이션을 위해)
      document.getElementById("top-nav").style.maxHeight = '500px';
    });
  </script>
</body>
</html>
