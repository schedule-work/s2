<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>[임상지원간호팀] 근무표</title>
  <link rel="icon" type="image/x-icon" href="https://schedule-work.github.io/image/nurse.ico">
  <style>
    /* CSS 변수 선언 (테마 색상 관리) */
    :root {
      --primary-color: #2563eb;       /* 포인트 컬러 (블루) */
      --primary-bg: #eff6ff;          /* 선택된 메뉴 배경 */
      --bg-color: #f8fafc;            /* 전체 배경 */
      --sidebar-bg: #ffffff;          /* 사이드바 배경 */
      --text-main: #0f172a;           /* 기본 텍스트 */
      --text-muted: #64748b;          /* 보조 텍스트 */
      --border-color: #e2e8f0;        /* 테두리 색상 */
      --hover-bg: #f1f5f9;            /* 마우스 오버 배경 */
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden; /* 전체 페이지 스크롤 방지 */
    }

    /* 사이드바 영역 */
    .sidebar {
      width: 220px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 2px 0 8px rgba(0,0,0,0.02);
      position: relative;
      z-index: 10;
    }

    .sidebar.collapsed {
      width: 50px;
      padding: 20px 8px;
    }

    .sidebar .toggle-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .sidebar.collapsed .toggle-wrapper {
      justify-content: center;
    }

    .toggle-button {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-button:hover {
      background-color: var(--hover-bg);
      color: var(--text-main);
    }

    .sidebar.collapsed .section-title,
    .sidebar.collapsed .sub-buttons,
    .sidebar.collapsed .group-btn-text {
      display: none;
    }

    .section {
      margin-bottom: 16px;
    }

    /* 사이드바 버튼 공통 스타일 */
    .sidebar button {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 4px;
      background-color: transparent;
      color: var(--text-main);
      border: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sidebar button:hover {
      background-color: var(--hover-bg);
    }

    /* 대분류 버튼 (진료지원, 전담간호사) */
    .group-btn {
      font-weight: 600;
      color: var(--text-muted);
    }

    /* 하위 메뉴 (시트 목록) */
    .sub-buttons {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 4px;
      padding-left: 12px;
    }

    .sub-buttons button {
      font-size: 14px;
      padding: 8px 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* 활성화된 버튼 스타일 */
    .sidebar button.active {
      background-color: var(--primary-bg);
      color: var(--primary-color);
      font-weight: 600;
    }

    /* 콘텐츠 영역 */
    .content {
      flex-grow: 1;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .header-area {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .notice {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 구글 시트 iframe 컨테이너 (카드 스타일) */
    .iframe-container {
      flex-grow: 1;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      display: flex;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 로딩 상태 텍스트 */
    .loading-text {
      padding: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  
  <div class="sidebar" id="sidebar">
    <div class="toggle-wrapper">
      <button class="toggle-button" onclick="toggleSidebar()" title="사이드바 접기/펼치기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <div class="section">
      <button id="btn-group1" class="group-btn" onclick="toggleGroup('group1', this)">
        <span class="group-btn-text">📁 진료지원</span>
      </button>
      <div id="group1-sub" class="sub-buttons"></div>
    </div>
    
    <div class="section">
      <button id="btn-group2" class="group-btn" onclick="toggleGroup('group2', this)">
        <span class="group-btn-text">📁 전담간호사</span>
      </button>
      <div id="group2-sub" class="sub-buttons"></div>
    </div>
  </div>

  <div class="content">
    <div class="header-area">
      <h1>[임상지원간호팀] 통합 근무표</h1>
      <p class="notice">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        시트 로딩에 다소 시간이 걸릴 수 있습니다. 잠시만 기다려 주세요.
      </p>
    </div>
    
    <div class="iframe-container">
      <iframe id="sheet-frame" src=""></iframe>
    </div>
  </div>

  <script>
    const sheetGroups = {
      group1: {
        name: "진료지원",
        pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyaIg5AxN1I8wD2Jrjr1o952ObrO_sHA3vL_Z1403dZLx9u9ooqmlLyuv5fQmeN6HnMmFdIRgCfi7_/pubhtml",
        api: "https://script.google.com/macros/s/AKfycbz_FRqb7fbZwxNg_eWIXjDL15tW8iZGllcs7y6-qzZev7YtFHgRNJUSgm9n7352AZXJYw/exec"
      },
      group2: {
        name: "전담간호사",
        pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWjnyzr3Qa-UuQ9fRf3lwiRm4vVA7jLOPtJiYe9TU1C-n4dyHcqVk967ahJJWpG_SUbsXwfdBC8Rh-/pubhtml",
        api: "https://script.google.com/macros/s/AKfycbzBpLXtYgjmbzRp74KMrdb2_tZTJYkAQn_aMRQ2AQau3IoofRKA42tzEKpOGn4Hhftmew/exec"
      }
    };

    function toggleGroup(groupKey, buttonEl) {
      const container = document.getElementById(`${groupKey}-sub`);

      // 그룹 버튼 활성화 효과 처리는 제외하고, 서브 버튼들만 제어하도록 구조 변경
      if (container.childElementCount > 0) return;

      container.innerHTML = '<div class="loading-text">목록 불러오는 중...</div>';

      const { api, pubhtmlPrefix } = sheetGroups[groupKey];

      fetch(api)
        .then(res => res.json())
        .then(sheets => {
          container.innerHTML = '';
          sheets.forEach(({ name, gid }, index) => {
            const btn = document.createElement("button");
            btn.textContent = name;
            btn.onclick = () => {
              // iframe 소스 변경
              document.getElementById("sheet-frame").src = `${pubhtmlPrefix}?gid=${gid}&widget=true&headers=false`;
              
              // 모든 서브버튼 active 해제 후 현재 버튼 활성화
              document.querySelectorAll(".sub-buttons button").forEach(b => b.classList.remove("active"));
              btn.classList.add("active");
            };
            container.appendChild(btn);

            if (groupKey === 'group1' && index === 0) {
              btn.click();
            }
          });
        })
        .catch(err => {
          container.innerHTML = "<div class='loading-text' style='color:#ef4444;'>시트 로딩 실패</div>";
          console.error(err);
        });
    }

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("collapsed");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const groupKey = urlParams.get('group');
      const sheetName = urlParams.get('sheet');

      // ▶ URL 파라미터 없을 때만 진료지원 첫 시트 자동 로드
      if (!(groupKey && sheetName)) {
        fetch(sheetGroups.group1.api)
          .then(res => res.json())
          .then(sheets => {
            const first = sheets[0];
            if (first) {
              document.getElementById("sheet-frame").src =
                `${sheetGroups.group1.pubhtmlPrefix}?gid=${first.gid}&widget=true&headers=false`;
            }
          });
      }

      // 좌측 탭 렌더링은 항상 수행
      document.getElementById("btn-group1")?.click();
      document.getElementById("btn-group2")?.click();

      // ▶ URL 파라미터로 들어왔을 경우 해당 시트 열기
      if (groupKey && sheetGroups[groupKey]) {
        fetch(sheetGroups[groupKey].api)
          .then(res => res.json())
          .then(sheets => {
            const match = sheets.find(s => s.name === sheetName);
            if (match) {
              document.getElementById("sheet-frame").src =
                `${sheetGroups[groupKey].pubhtmlPrefix}?gid=${match.gid}&widget=true&headers=false`;
              
              // 파라미터로 로드된 버튼 찾아 활성화 (약간의 딜레이 후 적용)
              setTimeout(() => {
                const subContainer = document.getElementById(`${groupKey}-sub`);
                const buttons = subContainer.getElementsByTagName('button');
                for(let btn of buttons) {
                  if(btn.textContent === sheetName) {
                    btn.classList.add('active');
                    break;
                  }
                }
              }, 1000);
            }
          });
      }
    });
  </script>
</body>
</html>
