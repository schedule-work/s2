<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[임상지원간호팀] 통합 근무표</title>
    <link rel="icon" type="image/x-icon" href="https://schedule-work.github.io/image/nurse.ico">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 포트폴리오 감성의 폰트와 고딕 조합 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --canvas: #f8fafc;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --border-line: #cbd5e1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--canvas);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .font-mono-tag {
            font-family: 'JetBrains Mono', monospace;
        }

        /* 포트폴리오 특유의 정교한 아키텍처 라인 */
        .portfolio-frame {
            border-bottom: 2px solid var(--text-primary);
        }

        /* 대분류 탭 (포트폴리오 블록 스타일) */
        .portfolio-tab {
            position: relative;
            transition: all 0.2s ease;
        }

        .portfolio-tab[data-active="true"] {
            background-color: var(--text-primary);
            color: #ffffff;
            font-weight: 600;
        }

        .portfolio-tab[data-active="false"]:hover {
            background-color: #e2e8f0;
        }

        /* 소분류 뱃지 (업무용 필터 스타일) */
        .sub-scroll {
            display: flex;
            overflow-x: auto;
            align-items: center;
            scrollbar-width: none;
            gap: 0.5rem;
        }
        .sub-scroll::-webkit-scrollbar {
            display: none;
        }

        .sub-badge {
            padding: 0.4rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 500;
            background-color: var(--surface);
            border: 1px solid var(--border-line);
            color: var(--text-secondary);
            white-space: nowrap;
            transition: all 0.2s;
            cursor: pointer;
        }

        .sub-badge:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .sub-badge[data-active="true"] {
            background-color: #eff6ff;
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        /* 깔끔한 로딩 스피너 */
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- 1. 포트폴리오 구조 헤더 (감각적인 메인 타이틀 바) -->
    <header class="portfolio-frame bg-white px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center shrink-0">
        <div class="flex items-center gap-3">
            <span class="w-3 h-3 bg-blue-600"></span>
            <div>
                <h1 class="font-bold text-base tracking-tight uppercase">KUMC Clinical Support Nursing</h1>
                <p class="text-xs text-gray-500 font-mono-tag tracking-wider mt-0.5">INTEGRATED DUTY SCHEDULE SYSTEM</p>
            </div>
        </div>
        <div class="hidden md:flex items-center gap-4 text-xs font-mono-tag text-gray-400 mt-2 sm:mt-0">
            <span>LOC: GURO HOSPITAL</span>
            <span>//</span>
            <span>STATUS: ACTIVE</span>
        </div>
    </header>

    <!-- 2. 컨트롤 네비게이션 영역 -->
    <nav class="bg-white border-b border-gray-300 px-6 py-3 flex flex-col md:flex-row items-start md:items-center justify-between gap-3 shrink-0">
        <!-- 대분류 선택 (포트폴리오 세그먼트 버튼) -->
        <div class="flex gap-1 bg-gray-100 p-1 rounded">
            <button id="btn-group1" class="portfolio-tab px-4 py-1.5 text-xs font-medium rounded" onclick="toggleGroup('group1', this)">
                진료지원 파트
            </button>
            <button id="btn-group2" class="portfolio-tab px-4 py-1.5 text-xs font-medium rounded" onclick="toggleGroup('group2', this)">
                전담간호사 파트
            </button>
        </div>

        <!-- 소분류 선택 (업무용 가독성 뱃지) -->
        <div class="flex-1 w-full md:w-auto md:ml-6 overflow-hidden">
            <div id="group1-sub" class="sub-scroll hidden"></div>
            <div id="group2-sub" class="sub-scroll hidden"></div>
        </div>
    </nav>

    <!-- 3. 메인 콘텐츠 (구글 시트 100% 풀스크린 배치) -->
    <main class="flex-1 w-full relative z-0 bg-white">
        <!-- 로딩 화면 -->
        <div id="loading-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-20 hidden">
            <div class="spinner mb-3"></div>
            <div class="text-xs font-mono-tag text-gray-500 tracking-widest uppercase">Loading Sheet Data...</div>
        </div>
        
        <!-- 구글 시트 프레임 -->
        <iframe id="sheet-frame" class="absolute inset-0 w-full h-full border-0" src=""></iframe>
    </main>

    <script>
        // API 설정 유지
        const sheetGroups = {
            group1: {
                name: "진료지원",
                pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyaIg5AxN1I8wD2Jrjr1o952ObrO_sHA3vL_Z1403dZLx9u9ooqmlLyuv5fQmeN6HnMmFdIRgCfi7_/pubhtml",
                api: "https://script.google.com/macros/s/AKfycbz_FRqb7fbZwxNg_eWIXjDL15tW8iZGllcs7y6-qzZev7YtFHgRNJUSgm9n7352AZXJYw/exec"
            },
            group2: {
                name: "전담간호사",
                pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWjnyzr3Qa-UuQ9fRf3lwiRm4vVA7jLOPtJiYe9TU1C-n4dyHcqVk967ahJJWpG_SUbsXwfdBC8Rh-/pubhtml",
                api: "https://script.google.com/macros/s/AKfycbzBpLXtYgjmbzRp74KMrdb2_tZTJYkAQn_aMRQ2AQau3IoofRKA42tzEKpOGn4Hhftmew/exec"
            }
        };

        function toggleGroup(groupKey, buttonEl) {
            document.getElementById('group1-sub').classList.add('hidden');
            document.getElementById('group2-sub').classList.add('hidden');
            
            const container = document.getElementById(`${groupKey}-sub`);
            container.classList.remove('hidden');

            document.querySelectorAll(".portfolio-tab").forEach(btn => btn.dataset.active = "false");
            buttonEl.dataset.active = "true";

            if (container.childElementCount > 0) return;

            const loadingOverlay = document.getElementById("loading-overlay");
            loadingOverlay.classList.remove("hidden");

            const { api, pubhtmlPrefix } = sheetGroups[groupKey];

            fetch(api)
                .then(res => res.json())
                .then(sheets => {
                    container.innerHTML = '';
                    sheets.forEach(({ name, gid }, index) => {
                        const btn = document.createElement("button");
                        btn.textContent = name;
                        
                        btn.className = "sub-badge rounded";
                        btn.dataset.active = "false";
                        
                        btn.onclick = () => {
                            document.getElementById("sheet-frame").src = `${pubhtmlPrefix}?gid=${gid}&widget=true&headers=false`;
                            
                            document.querySelectorAll(".sub-badge").forEach(b => b.dataset.active = "false");
                            btn.dataset.active = "true";
                        };
                        container.appendChild(btn);

                        if (groupKey === 'group1' && index === 0) {
                            btn.click();
                        }
                    });
                })
                .catch(err => {
                    container.innerHTML = "<p class='text-red-500 text-xs font-medium'>데이터 로드 실패</p>";
                    console.error(err);
                })
                .finally(() => {
                    loadingOverlay.classList.add("hidden");
                });
        }

        // 초기화 및 URL 파라미터 로직 유지
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const groupKey = urlParams.get('group');
            const sheetName = urlParams.get('sheet');

            if (!(groupKey && sheetName)) {
                document.getElementById("btn-group1")?.click(); 
                
                fetch(sheetGroups.group1.api)
                    .then(res => res.json())
                    .then(sheets => {
                        const first = sheets[0];
                        if (first) {
                            document.getElementById("sheet-frame").src =
                                `${sheetGroups.group1.pubhtmlPrefix}?gid=${first.gid}&widget=true&headers=false`;
                        }
                    });
            } else {
                const targetGroupBtn = document.getElementById(`btn-${groupKey}`);
                if(targetGroupBtn) targetGroupBtn.click();

                if (sheetGroups[groupKey]) {
                    fetch(sheetGroups[groupKey].api)
                        .then(res => res.json())
                        .then(sheets => {
                            const match = sheets.find(s => s.name === sheetName);
                            if (match) {
                                document.getElementById("sheet-frame").src =
                                    `${sheetGroups[groupKey].pubhtmlPrefix}?gid=${match.gid}&widget=true&headers=false`;
                                
                                setTimeout(() => {
                                    const subContainer = document.getElementById(`${groupKey}-sub`);
                                    const buttons = subContainer.getElementsByTagName('button');
                                    for(let btn of buttons) {
                                        if(btn.textContent === sheetName) {
                                            document.querySelectorAll(".sub-badge").forEach(b => b.dataset.active = "false");
                                            btn.dataset.active = "true";
                                            break;
                                        }
                                    }
                                }, 1000);
                            }
                        });
                }
            }
        });
    </script>
</body>
</html>
